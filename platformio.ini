[platformio]
default_envs = esp32dev

[env]
platform = espressif32@7.0.1
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.17
    adafruit/Adafruit GFX Library@^1.12.6

[env:esp32dev]
board = esp32dev
upload_speed = 921600
build_flags =
    -D OLED_SDA=21
    -D OLED_SCL=22

; ESP32-S3-DevKitC-1 is not built until its module variant and OLED pins are
; known. This platform's esp32-s3-devkitc-1 board is the N8, 8 MB, no-PSRAM
; variant. GPIO 22 does not exist on ESP32-S3, so do not reuse the ESP32 pins.
; [env:esp32s3]
; board = esp32-s3-devkitc-1
; upload_speed = 460800
; build_flags =
;     -D OLED_SDA=
;     -D OLED_SCL=
