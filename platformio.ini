[platformio]
default_envs = esp32_tx, esp32s3_rx1, esp32s3_rx2

[env]
platform = espressif32@7.0.1
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.17
    adafruit/Adafruit GFX Library@^1.12.6

; M0 roles are selected per board with -D CSI_NODE_ID (1..254 RX,
; 255 TX softAP, 0 unset and rejected by the host).
; Inventory: 1x classic ESP32 (TX) + 2x ESP32-S3-N16R8 (RX, no OLED).
[env:esp32_rx1]
board = esp32dev
upload_speed = 921600
build_flags =
    -D OLED_SDA=21
    -D OLED_SCL=22
    -D CSI_NODE_ID=1

[env:esp32_tx]
board = esp32dev
upload_speed = 921600
build_flags =
    -D OLED_SDA=21
    -D OLED_SCL=22
    -D CSI_NODE_ID=255

; ESP32-S3-N16R8 RX nodes: 16 MB flash + 8 MB octal PSRAM, no external
; OLED (-D NO_OLED makes the display a no-op so setup() never blocks).
; Base board definition is the DevKitC-1 variant; flash/PSRAM sizes are
; overridden below to match the N16R8 module.
[env:esp32s3_rx1]
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_build.psram_type = opi
board_upload.flash_size = 16MB
upload_speed = 921600
build_flags =
    -D NO_OLED
    -D CSI_NODE_ID=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM

[env:esp32s3_rx2]
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_build.psram_type = opi
board_upload.flash_size = 16MB
upload_speed = 921600
build_flags =
    -D NO_OLED
    -D CSI_NODE_ID=2
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
;
; ESP32-C5 is not supported: espressif32@7.0.1 ships no C5 board definitions
; and the Arduino core has no C5 variant, so no env can target it. Revisit
; only with a platform that supports C5 plus verified CSI APIs.
